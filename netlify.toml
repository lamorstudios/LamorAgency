[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sicherheits- und Cache-Header
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Redirects von alten Wix-URLs -> neue URLs.
# Die Wix-URLs werden nach der Prüfung der Live-Site ergänzt (Beispiel):
# [[redirects]]
#   from = "/contact-1"
#   to = "/contact/"
#   status = 301
[[redirects]]
  from = "/contact-1"
  to = "/contact/"
  status = 301
